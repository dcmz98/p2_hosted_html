<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>COHS Poster</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: #f4f4f4;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .wrap {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      box-sizing: border-box;
    }
    img {
      max-width: 100%;
      max-height: 90vh;
      height: auto;
      box-shadow: 0 2px 16px rgba(0,0,0,0.15);
      border-radius: 4px;
    }
    a.download {
      margin-top: 16px;
      font-size: 14px;
      color: #555;
      text-decoration: none;
    }
    a.download:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="wrap">
    <img src="COHS_poster.png" alt="COHS Poster">
    <a class="download" href="COHS_poster.png" download>Download poster</a>
  </div>
</body>
</html>
